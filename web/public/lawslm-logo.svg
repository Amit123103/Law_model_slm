<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" fill="none">
  <!-- Shield Body -->
  <path d="M100 10 L180 50 L180 130 C180 170 145 210 100 230 C55 210 20 170 20 130 L20 50 Z" fill="url(#shieldGrad)" stroke="#1e40af" stroke-width="3"/>
  <!-- Inner Shield -->
  <path d="M100 25 L168 58 L168 128 C168 162 138 198 100 215 C62 198 32 162 32 128 L32 58 Z" fill="url(#innerGrad)" opacity="0.15"/>
  <!-- Balance Scale Base -->
  <line x1="100" y1="70" x2="100" y2="145" stroke="#1e3a8a" stroke-width="4" stroke-linecap="round"/>
  <!-- Scale Beam -->
  <line x1="55" y1="90" x2="145" y2="90" stroke="#1e3a8a" stroke-width="4" stroke-linecap="round"/>
  <!-- Left Pan Strings -->
  <line x1="55" y1="90" x2="45" y2="120" stroke="#2563eb" stroke-width="2"/>
  <line x1="55" y1="90" x2="65" y2="120" stroke="#2563eb" stroke-width="2"/>
  <!-- Left Pan -->
  <ellipse cx="55" cy="122" rx="22" ry="6" fill="#2563eb" opacity="0.8"/>
  <!-- Right Pan Strings -->
  <line x1="145" y1="90" x2="135" y2="120" stroke="#2563eb" stroke-width="2"/>
  <line x1="145" y1="90" x2="155" y2="120" stroke="#2563eb" stroke-width="2"/>
  <!-- Right Pan -->
  <ellipse cx="145" cy="122" rx="22" ry="6" fill="#2563eb" opacity="0.8"/>
  <!-- Top Circle -->
  <circle cx="100" cy="70" r="10" fill="#2563eb"/>
  <!-- L Letter -->
  <text x="95" y="77" font-family="Arial Black" font-size="16" font-weight="900" fill="white" text-anchor="middle">L</text>
  <!-- Hexagon AI Nodes -->
  <circle cx="80" cy="42" r="5" fill="#f59e0b"/>
  <circle cx="100" cy="35" r="5" fill="#f59e0b"/>
  <circle cx="120" cy="42" r="5" fill="#f59e0b"/>
  <circle cx="90" cy="50" r="4" fill="#2563eb"/>
  <circle cx="110" cy="50" r="4" fill="#2563eb"/>
  <!-- Base -->
  <rect x="80" y="145" width="40" height="6" rx="3" fill="#1e3a8a"/>
  <!-- Gradients -->
  <defs>
    <linearGradient id="shieldGrad" x1="20" y1="10" x2="180" y2="230">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="32" y1="25" x2="168" y2="215">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
  </defs>
</svg>
