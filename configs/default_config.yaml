model:
  vocab_size: 32000
  d_model: 512
  n_heads: 8
  n_layers: 8
  d_ff: 2048
  max_seq_len: 1024
  norm_type: "rmsnorm"
  activation: "swiglu"
  pos_encoding_type: "rope"
  dropout: 0.1
  bias: false
  tie_word_embeddings: true
  rope_base: 10000.0
  layer_norm_eps: 1.0e-5

training:
  batch_size: 16
  eval_batch_size: 16
  learning_rate: 3.0e-4
  min_learning_rate: 3.0e-5
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  adam_eps: 1.0e-8
  grad_clip_norm: 1.0
  warmup_steps: 500
  max_steps: 10000
  epochs: 5
  grad_accum_steps: 2
  optimizer_name: "adamw"
  scheduler_name: "cosine"
  mixed_precision: "fp16"
  device: "auto"
  seed: 42
  output_dir: "checkpoints"
  save_interval_steps: 1000
  eval_interval_steps: 500
  log_interval_steps: 50
  early_stopping_patience: 10
